spring:
  config:
    import: optional:application-local.yml
  application:
    name: ai-zero-code
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zero_code}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ttl: ${REDIS_TTL:3600}
      database: ${REDIS_DATABASE:0}
  # 后端 session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: ${SESSION_TIMEOUT:2592000s}
    redis:
      namespace: ${SPRING_SESSION_REDIS_NAMESPACE:zerocode:session}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
    # 前端 cookie 30 天过期
    session:
      cookie:
        max-age: ${SESSION_COOKIE_MAX_AGE:2592000s}
        http-only: ${SESSION_COOKIE_HTTP_ONLY:true}
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_CHAT_API_KEY:}
      model-name: ${AI_CHAT_MODEL_NAME:deepseek-v4-flash}
      log-requests: ${AI_LOG_REQUESTS:false}
      log-responses: ${AI_LOG_RESPONSES:false}
    # 实时聊天 AI 模型配置
    streaming-chat-model:
      base-url: ${AI_STREAMING_BASE_URL:${AI_CHAT_BASE_URL:https://api.deepseek.com}}
      api-key: ${AI_STREAMING_API_KEY:${AI_CHAT_API_KEY:}}
      model-name: ${AI_STREAMING_MODEL_NAME:deepseek-v4-flash}
      log-requests: ${AI_LOG_REQUESTS:false}
      log-responses: ${AI_LOG_RESPONSES:false}
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: ${AI_REASONING_BASE_URL:${AI_CHAT_BASE_URL:https://api.deepseek.com}}
      api-key: ${AI_REASONING_API_KEY:${AI_CHAT_API_KEY:}}
      model-name: ${AI_REASONING_MODEL_NAME:deepseek-v4-pro}
      max-tokens: ${AI_REASONING_MAX_TOKENS:65536}
      temperature: ${AI_REASONING_TEMPERATURE:0.1}
      log-requests: ${AI_LOG_REQUESTS:false}
      log-responses: ${AI_LOG_RESPONSES:false}
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: ${AI_ROUTING_BASE_URL:${AI_CHAT_BASE_URL:https://api.deepseek.com}}
      api-key: ${AI_ROUTING_API_KEY:${AI_CHAT_API_KEY:}}
      model-name: ${AI_ROUTING_MODEL_NAME:deepseek-v4-flash}
      log-requests: ${AI_LOG_REQUESTS:false}
      log-responses: ${AI_LOG_RESPONSES:false}
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-shanghai}
    bucket: ${COS_BUCKET:}

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.cyx.aizerocode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

pexels:
  api-key: ${PEXELS_API_KEY:}

# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  image-model: ${DASHSCOPE_IMAGE_MODEL:wan2.2-t2i-flash}

# 生成产物与单机演示配置。真实线上值建议写入服务器受限 env 文件。
zerocode:
  code:
    output-root: ${CODE_OUTPUT_ROOT:${user.dir}/tmp/code_output}
    deploy-root: ${CODE_DEPLOY_ROOT:${user.dir}/tmp/code_deploy}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost}
  screenshot:
    enabled: ${SCREENSHOT_ENABLED:true}
    temp-root: ${SCREENSHOT_TEMP_ROOT:${user.dir}/tmp/screenshots}
    chrome-binary-path: ${CHROME_BINARY_PATH:}
    chrome-driver-path: ${CHROME_DRIVER_PATH:}
  build:
    npm-executable: ${NPM_EXECUTABLE:npm}
    npm-cache-root: ${NPM_CACHE_ROOT:${user.dir}/tmp/npm-cache}
  generation:
    demo-mode: ${GENERATION_DEMO_MODE:true}
    global-concurrency: ${GENERATION_GLOBAL_CONCURRENCY:1}
    daily-quota: ${GENERATION_DAILY_QUOTA:10}
    max-prompt-length: ${GENERATION_MAX_PROMPT_LENGTH:2000}
    lease-ttl: ${GENERATION_LEASE_TTL:10m}
    timeout: ${GENERATION_TIMEOUT:10m}

# Actuator 管理端配置
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
